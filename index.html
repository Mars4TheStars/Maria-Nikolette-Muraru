<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="keywords" content="Maria-Nikolette Muraru, Portfolio, Art, Music, Poetry, Sculptures">
<meta name="description" content="Portfolio showcasing the creative works of Maria-Nikolette Muraru.">
<meta name="viewport" content="width=device-width, initial-scale=1">    

<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Background canvas setup */
#grad1 {
  background-image: linear-gradient(to top, #E5F9E0, #A3F7B5, #40C9A2, #2F9C95);
  background-color: #E5F9E0;
  min-height: 100vh;
  background-attachment: fixed;
  padding: 20px;
  font-family: 'Courier New', monospace;
  position: relative;
  overflow-x: hidden;
}

/* Canvas overlay for particle effects */
#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* Structural elements elevated above canvas */
header, .navbar, .banner-img, .container, footer {
  position: relative;
  z-index: 2;
}

/* Header */
header {
  padding: 25px;
  text-align: center;
  background: #2F9C95;
  color: white;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-bottom: 15px;
}

header h2 {
  font-size: 2.2rem;
  letter-spacing: 1px;
}

header h4 {
  margin-top: 5px;
  font-weight: normal;
  color: #A3F7B5;
}


/* Top navigation bar */
.navbar {
  display: flex;
  background-color: #40C9A2;
}

/* Navigation bar links */
.navbar a {
  color: #E5F9E0; /* text color */
  padding: 14px 20px;
  text-decoration: none;
  text-align: center;
}

.navbar a:hover {
  background-color: #2F9C95;
  color: #A3F7B5;
}

/* Banner asset frame */
.banner-img {
  width: 100%;
  height: auto;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-bottom: 25px;
  display: block;
}

/* Column layout split */
.container {  
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

/* Main Content Panels */
.side, .main {
  border: 3px solid #000;
  box-shadow: 8px 8px 0px #000;
  padding: 30px;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  transform-style: preserve-3d;
}

.side {
  flex: 1 1 300px;
  background-color: #2F9C95;
  color: white;
}

.main {
  flex: 2 1 500px;
  background-color: #A3F7B5;
  color: #000;
}

p {
  font-size: 1.4rem;
  line-height: 1.4;
  transform: translateZ(20px); /* Bumps text forward in 3D space */
}

a.mail-link {
  color: #2F9C95;
  font-weight: bold;
  text-decoration: underline;
}

/* Floating Social Media Buttons */
.social-container {
  display: flex;            
  flex-direction: row;      
  align-items: center;      
  gap: 25px;
  margin-top: 20px;                
}

.image-button {
  padding: 10px;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Dynamic lift bounce on hover */
.image-button:hover {
  transform: translateY(-8px) scale(1.08) translateZ(30px);

}

.image-button img {
  border: none;
  display: block;      
}

.social-container .image-button:nth-child(1) img { width: 100px; }
.social-container .image-button:nth-child(2) img { width: 80px; }

/* Footer */
footer {
  padding: 25px;
  text-align: center;
  background: #E5F9E0;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-top: 30px;
}

/* Responsive layout - when the screen is less than 700px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 700px) {
  .container, .navbar {   
    flex-direction: column;
  }
}

</style>
</head>
<body>

<div id="grad1">
  <!-- Dynamic Interactive Particle Layer Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Header -->
  <header>
    <h2>Maria-Nikolette Muraru</h2>
    <h4>Artist • Writer • Musician</h4>
  </header>

  <!-- Navigation Bar -->
  <div class="navbar">
    <a href="index.html">Main Page</a>
    <a href="MyFiction.html">My Fiction</a>
    <a href="MyMusic.html">My Music</a>
    <a href="MySculptures.html">My Sculptures</a>
    <a href="MyPoetry.html">My Poetry</a>
    <a href="MyPaintings.html">My Paintings</a>
    <a href="MyVideography.html">My Films</a>
    <a href="MyAboutMe.html">About Me</a>
  </div>

  <!-- Banner -->
  <img src="Images/channels4_banner.jpg" alt="banner" class="banner-img">
    
  <!-- Content Panels -->
  <div class="container">
    <div class="side interactive-card">
      <p style="font-size:25px;">Hello, my name is <strong>Maria-Nikolette Muraru</strong>. Take a look at my <i>Portfolio</i>!</p> 
    </div>

    <div class="main interactive-card">
      <p><u>Contact Me:</u> <a href="mailto:marianikolettemuraru@gmail.com" class="mail-link">marianikolettemuraru@gmail.com</a></p>
      <p style="margin-top: 15px;"><u>Follow me on:</u></p>

      <div class="social-container" style="transform: translateZ(25px);">
        <a href="https://youtube.com" class="image-button"> 
          <img src="Sprites/youtube-logo-transparent.webp" alt="Youtube">
        </a>
        <a href="https://itch.io" class="image-button"> 
          <img src="gif/a72437afb97803a6acb5420ef8b8a90f.png" alt="itch.io">

  <footer>
    <p>Maria-Nikolette Muraru &copy; 2026</p>
  </footer>
</div>


</body>

<body>

  <!-- Custom Cursor Graphic Elements -->
  <div id="custom-cursor"></div>
  <div id="cursor-follower"></div>

  <!-- JavaScript Interaction Logic Controller -->
  <script>
    const cursorDot = document.getElementById('custom-cursor');
    const cursorFollower = document.getElementById('cursor-follower');

    // 1. Core Position Tracking
    window.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      // Bind basic dot instantly to client coordinate points
      cursorDot.style.left = `${mouseX}px`;
      cursorDot.style.top = `${mouseY}px`;

      // Follower trails slightly behind automatically via CSS easing values
      cursorFollower.style.left = `${mouseX}px`;
      cursorFollower.style.top = `${mouseY}px`;
    });

    // 2. Interactive Hover States (Selects links, buttons, and your spikeball wrapper)
    const interactiveElements = document.querySelectorAll('a, button, .image-button, .side-wrapper, .navbar a');
    
    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        document.body.classList.add('cursor-hover');
      });
      el.addEventListener('mouseleave', () => {
        document.body.classList.remove('cursor-hover');
      });
    });

    // 3. Click Ripple Wave Generation Physics
    window.addEventListener('click', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      
      document.body.appendChild(ripple);

      // Clean up the node immediately after the animation completes
      setTimeout(() => {
        ripple.remove();
      }, 400);
    });
  </script>

</body>

</html>
