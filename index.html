<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


/* Banner asset frame */
.banner-img {
  width: 100%;
  height: auto;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-bottom: 25px;
  display: block;
}

/* Column layout split */
.container {  
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  
}

/* Main Content Panels */
.side, .main {
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  padding: 30px;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  transform-style: preserve-3d;
}

.side {
  flex: 1 1 300px;
  background-color: #389c2f;
  color: white;
}

.main {
  flex: 2 1 500px;
  background-color: #e0ff82;
  color: #000;
}

p {
  font-size: 1.4rem;
  line-height: 1.4;
  
}

a.mail-link {
  color: #2F9C95;
  font-weight: bold;
  text-decoration: underline;
}

/* Floating Social Media Buttons */
.social-container {
  display: flex;            
  flex-direction: row;      
  align-items: center;      
  gap: 25px;
  margin-top: 20px;                
}

.image-button {
  padding: 10px;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Dynamic lift bounce on hover */
.image-button:hover {
  transform: translateY(-8px) scale(1.08) translateZ(30px);

}

.image-button img {
  border: none;
  display: block;      
}

.social-container .image-button:nth-child(1) img { width: 100px; }
.social-container .image-button:nth-child(2) img { width: 80px; }
.social-container .image-button:nth-child(3) img { width: 80px; }


/* Responsive layout - when the screen is less than 700px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 700px) {
  .container, .navbar {   
    flex-direction: column;
  }

  .main, .side{
    width: fit-content;
    width: 100%;
    flex:1;
  }
    
  .social-container {
  display: flex;            
  flex-direction: column;      
  align-items: center;      
  gap: 25px;
  margin-top: 20px; 
  }
    
}

</style>

<body>
  <script>

 const cursorWrapper = document.getElementById('avif-airplane-cursor');

document.addEventListener('mousemove', (e) => {
    // 1. Instantly move the cursor to the true mouse coordinates
    cursorWrapper.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
    
    // 2. Reveal the cursor now that we know exactly where it belongs
    cursorWrapper.classList.add('is-active');
}, { passive: true });

// Optional: Hide it again if the mouse leaves the browser window entirely
document.addEventListener('mouseleave', () => {
    cursorWrapper.classList.remove('is-active');
});

</script>
