<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Background canvas setup */
#grad1 {
  background-image: linear-gradient(to top, #E5F9E0, #A3F7B5, #40C9A2, #2F9C95);
  background-color: #E5F9E0;
  min-height: 100vh;
  background-attachment: fixed;
  padding: 20px;
  font-family: 'Courier New', monospace;
  position: relative;
  overflow-x: hidden;
}

/* Canvas overlay for particle effects */
#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* Structural elements elevated above canvas */
header, .navbar, .banner-img, .container, footer {
  position: relative;
  z-index: 2;
}

/* Header */
header {
  padding: 25px;
  text-align: center;
  background: #2F9C95;
  color: white;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-bottom: 15px;
}

header h2 {
  font-size: 2.2rem;
  letter-spacing: 1px;
}

header h4 {
  margin-top: 5px;
  font-weight: normal;
  color: #A3F7B5;
}

/* Top navigation bar with arcade-style hover states */
.navbar {
  display: flex;
  background-color: #40C9A2;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-bottom: 20px;
  overflow: hidden;
}

.navbar a {
  color: #E5F9E0;
  padding: 14px 10px;
  text-decoration: none;
  text-align: center;
  font-weight: bold;
  flex: 1;

  border-right: 2px solid rgba(0,0,0,0.15);

    display: flex;
  align-items: center;
  justify-content: center;
}

.navbar a:hover {
  background-color: #2F9C95;
  color: #A3F7B5;
  transform: scale(1.05);
}

/* Banner asset frame */
.banner-img {
  width: 100%;
  height: auto;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-bottom: 25px;
  display: block;
}

/* Column layout split */
.container {  
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  perspective: 1000px; /* Activates 3D tilting space */
}

/* Interactive 3D Side/Main Content Panels */
.side, .main {
  border: 3px solid #000;
  box-shadow: 8px 8px 0px #000;
  padding: 30px;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  transform-style: preserve-3d;
}

.side {
  flex: 1 1 300px;
  background-color: #2F9C95;
  color: white;
}

.main {
  flex: 2 1 500px;
  background-color: #A3F7B5;
  color: #000;
}

p {
  font-size: 1.4rem;
  line-height: 1.4;
  transform: translateZ(20px); /* Bumps text forward in 3D space */
}

a.mail-link {
  color: #2F9C95;
  font-weight: bold;
  text-decoration: underline;
}

/* Floating Social Media Buttons */
.social-container {
  display: flex;            
  flex-direction: row;      
  align-items: center;      
  gap: 25px;
  margin-top: 20px;                
}

.image-button {
  padding: 10px;
  
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Dynamic lift bounce on hover */
.image-button:hover {
  transform: translateY(-8px) scale(1.08) translateZ(30px);

}

.image-button img {
  border: none;
  display: block;      
}

.social-container .image-button:nth-child(1) img { width: 100px; }
.social-container .image-button:nth-child(2) img { width: 80px; }

/* Footer */
footer {
  padding: 25px;
  text-align: center;
  background: #E5F9E0;
  border: 3px solid #000;
  box-shadow: 6px 6px 0px #000;
  margin-top: 30px;
}

/* Responsiveness fallback */
@media screen and (max-width: 700px) {
  .container { flex-direction: column; }
  .navbar { flex-direction: column; }
}
</style>

<body>

<script>
  /* INTERACTION SCRIPT 1: 3D MOUSE PARALLAX CARD TILT */
  const cards = document.querySelectorAll('.interactive-card');
  
  cards.forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Calculate rotation weights based on cursor coordinate offset points
      const xc = rect.width / 2;
      const yc = rect.height / 2;
      const angleX = (yc - y) / 10;
      const angleY = (x - xc) / 15;
      
      card.style.transform = `rotateX(${angleX}deg) rotateY(${angleY}deg) scale(1.01)`;
      card.style.boxShadow = `${-angleY * 1.5}px ${angleX * 1.5}px 12px rgba(0,0,0,0.3), 8px 8px 0px #000`;
    });
    
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      card.style.boxShadow = '8px 8px 0px #000';
    });
  });

  /* INTERACTION SCRIPT 2: FLOATING CANVAS SPARK PARTICLES */
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  
  let particles = [];
  
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + Math.random() * 100;
      this.size = Math.random() * 4 + 2;
      this.speedY = Math.random() * 1 + 0.4;
      // Cycle theme accent configurations safely
      this.color = Math.random() > 0.5 ? '#40C9A2' : '#2F9C95';
      this.opacity = Math.random() * 0.5 + 0.2;
    }
    update() {
      this.y -= this.speedY;
      if (this.y < -10) {
        this.y = canvas.height + 10;
        this.x = Math.random() * canvas.width;
      }
    }
    draw() {
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.opacity;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function init() {
    particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();
</script>

</body>

<body>

  <!-- Custom Cursor Graphic Elements -->
  <div id="custom-cursor"></div>
  <div id="cursor-follower"></div>

  <!-- JavaScript Interaction Logic Controller -->
  <script>
    const cursorDot = document.getElementById('custom-cursor');
    const cursorFollower = document.getElementById('cursor-follower');

    // 1. Core Position Tracking
    window.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      // Bind basic dot instantly to client coordinate points
      cursorDot.style.left = `${mouseX}px`;
      cursorDot.style.top = `${mouseY}px`;

      // Follower trails slightly behind automatically via CSS easing values
      cursorFollower.style.left = `${mouseX}px`;
      cursorFollower.style.top = `${mouseY}px`;
    });

    // 2. Interactive Hover States (Selects links, buttons, and your spikeball wrapper)
    const interactiveElements = document.querySelectorAll('a, button, .image-button, .side-wrapper, .navbar a');
    
    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        document.body.classList.add('cursor-hover');
      });
      el.addEventListener('mouseleave', () => {
        document.body.classList.remove('cursor-hover');
      });
    });

    // 3. Click Ripple Wave Generation Physics
    window.addEventListener('click', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'cursor-click-ripple';
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      
      document.body.appendChild(ripple);

      // Clean up the node immediately after the animation completes
      setTimeout(() => {
        ripple.remove();
      }, 400);
    });
  </script>

</body>
